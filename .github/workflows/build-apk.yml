name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee build.log || {
            msg=$(grep -E '^e: |^w: .*(Unresolved|error)|What went wrong|FAILURE' -A1 build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors::$msg"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: HomeDragon-release-apk
          path: app/build/outputs/apk/release/app-release.apk
